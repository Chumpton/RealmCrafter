# Zezima form, ground gait: OSRS-stepped clips (poses held, 1 ms snaps), hand-keyed in art/zezima-anim/gait/build.py.
# idle 4 poses x 600 ms (2.4 s); walk r3 8 poses 120/120/160/120/80/160/80/120 ms (0.96 s, two steps): shoulders swing +-25 deg opposite the legs, held at contacts; trailing knee <= 30 deg, rear foot low, knee lifts forward on passing.
# run r2: 4 poses 160/140/160/140 ms (0.6 s, one tick): torso ~19 deg forward, elbows ~88 deg tucked, arm swing <= 35 deg, rear heel below the opposite knee.
# the ground speed (m/s) each cycle was keyed for: the clip plays at speed/design so the feet never skate
# s1 (2026-10-06): the clips ride as RAW stepped tracks (art/zezima-anim/raw/glb2raw.py from the hand-keyed source glbs), never through clip import:
# the import resampled to 30 fps linear, smearing every snap over 33 ms; raw tracks keep each pose two keys 1 ms apart, so the body snaps.
# node-local values on the mixamorig rig, every bone tracked (a held bone is two equal keys) so a clip switch never leaves a limb behind.
# previous imported addresses: idle cdn/clip-zezima-osrs-idle-v2-37d86961-loop.glb, walk cdn/clip-zezima-osrs-walk-r3-367a7957-loop.glb, run cdn/clip-zezima-osrs-run-r2-8f23ce5b-loop.glb

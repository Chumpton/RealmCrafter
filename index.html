<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealmCrafter - Offline Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      color: #e0f2fe;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 100;
      font-size: 13px;
      line-height: 1.5;
    }
    #overlay b {
      color: #38bdf8;
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    #status {
      margin-top: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>

  <!-- Stable UMD Dependencies (No Bundler / No ES Module ImportMap Conflicts) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
  <div id="overlay">
    <b>RealmCrafter World Viewer</b>
    Left Click + Drag: Orbit &bull; Right Click: Pan &bull; Scroll: Zoom
    <div id="status">Initializing engine and loading assets...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    // 1. Scene, Camera & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0c8f0);
    scene.fog = new THREE.FogExp2(0xa0c8f0, 0.0018);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 3000);
    camera.position.set(0, 50, 110);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 2. Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; // Keep camera above terrain
    controls.target.set(0, 5, 0);
    controls.update();

    // 3. Environmental Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.25);
    hemiLight.position.set(0, 250, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
    sunLight.position.set(120, 180, 80);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 600;
    const shadowD = 150;

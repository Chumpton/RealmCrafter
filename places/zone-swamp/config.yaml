    path-hollow: {kind: path, grade: true, maxGrade: 0.3, width: 2.6, material: mulch, edgeMaterial: moss, noise: 0.8, points: [[-56, -66], [-78, -92], [-96, -118], [-106, -132]]}
    clear-arrival: {kind: clear-scatter, center: {x: 0, z: -2}, shape: {kind: circle, radius: 7}}
  decorations:
    bindings:
      moss: [blades]
    layers:
      blades:
        density: 10
        items: [{colorJitter: {hue: 0.015, value: 0.08}, kind: scripted, maxDistance: 30, params: {height: 0.4}, randomRotation: true, scale: [0.8, 1.4], script: scripts/gen/valley-meadow.js, seed: 23, useTerrainColor: true, wind: {force: 0.07, scale: 1.3, speed: 0.5}}]
        constraints: {slopeRange: [0, 0.28]}
    settings: {budget: 26000, enabled: true, fadeDistance: 10, maxDistance: 40}
defaultSpawnPoint:
  x: 0
  z: -2
  y:
    terrain: 0
worldBounds:
  bottom: -60
arrivalBudget:
  bytes: 3000000 # same as main: creator 2026-09-28 a 10-15 s first load is fine

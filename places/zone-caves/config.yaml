# Deepdelve: the caves zone (design-zones.md Part 3 §8). A cavern bowl ~390 m across under a black ceiling void;
# no sun, every light is an emitter. Arrival: the timbered ledge at the origin, 6 m up, looking south down the haul road.
mode: 3d
gravity:
  x: 0
  y: -24
  z: 0
atmosphere:
  sky:
    kind: color
    color: '#040406'
  ground: true
  moon:
    enabled: false
  stars:
    enabled: false
  clouds:
    enabled: false
  wind:
    direction: 245
    speed: 0.6
  cycle:
    frozen: 18
  timeOfDay: 18
  ambient:
    light:
      color: '#6a6a88'
      intensity: 1.1
  hemisphere:
    skyColor: '#7c86b0'
    groundColor: '#3a2e26'
    intensity: 1.35
  look:
    script: scripts/look-den.js
    params:
      bloomRadius: 0.7
      bloomStrength: 0.3
      bloomThreshold: 0.9
      exposure: 1.7
      vignette: 0.1
      csCover: 0
      csK: 0.14
      csScale: 150
      csSeed: 831
      csSoft: 0.22
      nightK: 0
      twExp: 0
      twSat: 0.02
      twTemp: 0.02
      wetG: 0
      csN: 0.04
      inkPx: 3
      aerialK: 0.05
      aoK: 0.78
      aoR: 0.008
      bloomThrUser: 0.9
      bloomUser: 0.35
      celK: 0.3
      celSteps: 3
      contrast: 1.12
      creaseLo: 0.28
      daySat: 1.05
      fogFarX: 3
      fogNearX: 3.2
      glintK: 0.7
      mistK: 0.08
      posterK: 0.15
      shB: 1.02
      shG: 0.9
      shR: 0.98
      sunsetK: 0
      gradeHaze: 0.05
      inkFar: 300
      inkStrength: 1
  fog:
    kind: linear
    near: 70
    far: 375
    color: '#14141E'
terrain:
  kind: heightmap
  generator: scripts/zone-caves-ground.js
  materials:
  - {albedo: cdn/texture-terrain-wow-classic-hand-painted-grey-rock-strata-broad-brushstrokes-cool-purple-crevices-warm-sunlit-tops.png, antiTiling: stochastic, id: rock, macro: {hue: 0.03, scale: 90, value: 0.16}, normalStrength: 0.3, pbr: true, roughnessIntensity: 0.88, textureScale: 12, tint: oklch(0.62 0.02 285)}

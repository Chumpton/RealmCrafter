    path-lake: {kind: path, grade: true, maxGrade: 0.25, width: 3, material: haul, edgeMaterial: wet, noise: 0.8, falloff: 1.2, points: [[6, -150], [-18, -178], [-40, -212], [-58, -232]]}
    clear-arrival: {kind: clear-scatter, center: {x: 0, z: -2}, shape: {kind: circle, radius: 7}}
defaultSpawnPoint:
  x: 0
  z: -2
  y:
    terrain: 0
worldBounds:
  bottom: -60
arrivalBudget:
  bytes: 3000000 # same as main: creator 2026-09-28 a 10-15 s first load is fine

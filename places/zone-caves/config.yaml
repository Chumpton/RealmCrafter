    road-haul: {kind: path, grade: true, maxGrade: 0.22, width: 5, material: haul, edgeMaterial: gravel, noise: 0.6, falloff: 1.5, points: [[0, -8], [-1, -22], [2, -48], [6, -80], [4, -110], [6, -140], [8, -175]]}
    path-hub: {kind: path, grade: true, maxGrade: 0.25, width: 3.4, material: haul, edgeMaterial: gravel, noise: 0.7, falloff: 1.2, points: [[-1, -26], [-14, -34], [-28, -40]]}
    path-carts: {kind: path, grade: true, maxGrade: 0.25, width: 3.4, material: haul, edgeMaterial: gravel, noise: 0.7, falloff: 1.2, points: [[5, -72], [30, -76], [52, -84], [68, -92]]}

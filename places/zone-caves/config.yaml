  - {albedo: scripts/tex-valley-gravel.js, antiTiling: stochastic, id: gravel, normalStrength: 0.25, pbr: true, roughnessIntensity: 0.95, textureScale: 3, tint: oklch(0.6 0.015 260)}
  - {albedo: cdn/texture-terrain-stylized-painted-riverbank-mud-soft-brush-lowpoly.png, antiTiling: stochastic, id: wet, normalStrength: 0.15, pbr: true, roughnessIntensity: 0.3, textureScale: 4, tint: oklch(0.42 0.02 240)}
  - {albedo: cdn/texture-terrain-hand-painted-warcraft-light-tan-dusty-hiking-trail-packed-earth-small-pebbles.png, antiTiling: stochastic, id: haul, normalStrength: 0.2, pbr: true, roughnessIntensity: 0.9, textureScale: 4, tint: oklch(0.58 0.03 60)}

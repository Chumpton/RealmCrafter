      guitar: {buttons: [{action: chordG, label: G, size: primary, slot: 1}, {action: interact, label: GIVE BACK, slot: 2}, {action: pluck4, label: '4', slot: 3}, {action: pluck5, label: '5', slot: 4}, {action: pluck6, label: '6', slot: 5}, {action: chordC, label: C, slot: 6}, {action: chordD, label: D, slot: 7}, {action: pluck1, label: '1', zone: left, slot: 1}, {action: pluck2, label: '2', zone: left, slot: 2}, {action: pluck3, label: '3', zone: left, slot: 3}], look: true, orientation: any, pinch: false, sticks: [{x: moveX, y: moveZ, zone: left, anchor: fixed, visibility: always, quantize: 8}]}

      keys: left/right
    camOrbitY:
      keys: down/up
    moveX:
      keys: a/d
    moveZ:
      keys: s/w
  touch:
    active: scripts/touch-surface.js
    surfaces:
      default: {buttons: [{action: interact, label: USE, size: primary, slot: 1}, {action: jump, label: JUMP, slot: 2}], look: true, orientation: any, pinch: false, sticks: [{x: moveX, y: moveZ, zone: left, anchor: fixed, visibility: always, quantize: 8}]}
